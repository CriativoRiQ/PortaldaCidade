function crudList(key){const s=SCH[key];const items=(S[s.coll]||[]).slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));const ttl=x=>typeof s.title==='function'?s.title(x):x[s.title];return`<div class="row between" style="margin-bottom:12px"><span class="sm muted">${items.length} registro(s)</span><button class="btn btn-p btn-sm" data-act="crudForm" data-k="${key}">${ic('plus','s')} Novo: ${esc(s.label.toLowerCase())}</button></div>${items.length?`<div class="list">${items.map(x=>`<div class="li"><div class="grow"><b>${esc(ttl(x))}</b> ${demoTag(x)}<div class="sm muted">${esc(s.sub(x))}</div></div><button class="btn btn-sm" data-act="crudForm" data-k="${key}" data-id="${esc(x.id)}">${ic('edit','s')} Editar</button><button class="btn btn-sm btn-g btn-dl" data-act="crudDel" data-k="${key}" data-id="${esc(x.id)}" aria-label="Excluir">${ic('trash','s')}</button></div>`).join('')}</div>`:empty('Nenhum registro.')}`}
function fieldHtml([k,l,t,req,opts],v){const id='cf_'+k;const r=req?'required':'';if(t==='textarea')return`<div class="fld full"><label for="${id}">${l}</label><textarea id="${id}" name="${k}" ${r}>${esc(v??'')}</textarea></div>`;if(t==='select')return`<div class="fld"><label for="${id}">${l}</label><select id="${id}" name="${k}">${opts().map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;if(t==='checkbox')return`<div class="fld full"><label class="chk"><input type="checkbox" name="${k}" ${v||v===undefined&&k==='active'?'checked':''}> ${l}</label></div>`;if(t==='image')return`<div class="fld full"><label for="${id}">${l}</label>${safeImg(v?.url)?`<img src="${esc(safeImg(v.url))}" alt="" style="max-height:80px;border-radius:10px;margin-bottom:6px">`:''}<input id="${id}" type="file" name="${k}__file" accept="image/jpeg,image/png,image/webp"></div>`;if(t==='company')return`<div class="fld"><label for="${id}">${l}</label><select id="${id}" name="${k}" ${r}><option value="">—</option>${allCompanies().map(c=>`<option value="${esc(c.id)}" ${v===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;if(t==='companies')return`<div class="fld full"><span class="lbl2">${l}</span><div class="checks" style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px">${pubCompanies().map(c=>`<label class="chk"><input type="checkbox" name="${k}[]" value="${esc(c.id)}" ${(v||[]).includes(c.id)?'checked':''}>${esc(c.pubName)}</label>`).join('')||'<span class="sm muted">Nenhuma empresa publicada.</span>'}</div></div>`;return`<div class="fld"><label for="${id}">${l}</label><input id="${id}" type="${t==='number'?'text':t}" ${t==='number'?'inputmode="decimal"':''} name="${k}" value="${esc(v??'')}" ${r}></div>`}
ACT.crudForm=a=>{const s=SCH[a.dataset.k];const x=a.dataset.id?(S[s.coll]||[]).find(i=>i.id===a.dataset.id):{};modal(`<h3>${a.dataset.id?'Editar':'Novo'}: ${esc(s.label.toLowerCase())}</h3><form data-form="crud" data-k="${a.dataset.k}" data-id="${esc(a.dataset.id||'')}" novalidate><div class="fgrid">${s.fields.map(f=>fieldHtml(f,x[f[0]])).join('')}</div><div class="mact"><button type="button" class="btn" data-act="mNo">Cancelar</button><button class="btn btn-p">Salvar</button></div></form>`,{wide:true})};
FORM.crud=async(f,o)=>{clearErr(f);const key=f.dataset.k,s=SCH[key];const id=f.dataset.id||genId();const old=(S[s.coll]||[]).find(i=>i.id===id)||{};const data={...old};delete data.id;let bad=false;for(const[k,l,t,req]of s.fields){if(t==='image'){const file=f.querySelector(`[name="${k}__file"]`).files[0];if(file){try{data[k]=await uploadImage(file,{max:1600})}catch(e){return toast(e.message,'err')}}continue}let v=o[k];if(t==='number')v=v===''||v==null?null:num(v);if(t==='url'&&v)v=v.startsWith('#')?v:safeUrl(v);if(t==='companies')v=v||[];if(req&&(v==null||v==='')){fieldErr(f,k,'Campo obrigatório.');bad=true}data[k]=v}if(bad)return;data.updatedAt=now();data.createdAt=old.createdAt||now();if(key==='news'&&!data.publishedAt)data.publishedAt=dayKey();if(await W(saveColl(s.coll,id,data),'Salvo.')){addLog((f.dataset.id?'Editou ':'Criou ')+s.label.toLowerCase(),typeof s.title==='function'?s.title(data):data[s.title]);closeModal();render(false)}};
ACT.crudDel=async a=>{const s=SCH[a.dataset.k];const x=(S[s.coll]||[]).find(i=>i.id===a.dataset.id);if(!await confirmBox('Excluir este registro? Esta ação não pode ser desfeita.',{ok:'Excluir',danger:true}))return;if(await W(delColl(s.coll,a.dataset.id),'Excluído.')){addLog('Excluiu '+s.label.toLowerCase(),typeof s.title==='function'?s.title(x||{}):x?.[s.title]);render(false)}};
V['admin-eventos']=av('admin-eventos',{title:'Eventos',render(){const ce=ownerItems('events','e_').filter(x=>x.status!=='rascunho');return`<div class="dhead"><div><h1>Eventos</h1><p>Agenda municipal. Eventos enviados por empresas passam por moderação em Aprovações.</p></div></div>${crudList('events')}${ce.length?`<h3 style="margin-top:28px">Enviados por empresas</h3><div class="list">${ce.map(e=>`<div class="li"><div class="grow"><b>${esc(e.title)}</b><div class="sm muted">${esc(e.company?.name||'')} · ${fmtD(e.date)}</div></div>${statusChip(ISTAT,e.status)}${e.status==='aprovado'?`<button class="btn btn-sm btn-dl" data-act="modItem" data-k="e_" data-id="${esc(e.id)}" data-s="rejeitado">Retirar</button>`:e.status==='pendente'?`<button class="btn btn-sm btn-v" data-act="modItem" data-k="e_" data-id="${esc(e.id)}" data-s="aprovado">Aprovar</button>`:''}</div>`).join('')}</div>`:''}`}});
V['admin-conteudos']=av('admin-conteudos',{title:'Conteúdos',render(){const t=S.ctab||'news';const tabs=[['news','Notícias'],['tourism','Turismo'],['phones','Telefones úteis'],['jobs','Vagas'],['opps','Oportunidades'],['reviews','Avaliações']];let body;if(t==='reviews'){const all=[];for(const[uid,d]of Object.entries(S.reviews))for(const[cid,r]of Object.entries(d.items||{}))all.push({uid,cid,...r});body=all.length?`<div class="list">${all.sort((a,b)=>(b.at||0)-(a.at||0)).map(r=>{const hid=S.mod['r_'+r.uid+'_'+r.cid]?.status==='oculto';return`<div class="li"><div class="grow"><b>${esc(compById(r.cid)?.name||'Empresa removida')}</b> · <span class="stars">${'★'.repeat(+r.rating)}</span><div class="sm">${esc(r.text||'')}</div><div class="xs muted">${fmtD(r.at)}</div></div>${hid?'<span class="chip chip-rd">Oculta</span>':''}<button class="btn btn-sm ${hid?'':'btn-dl'}" data-act="hideRev" data-u="${esc(r.uid)}" data-c="${esc(r.cid)}" data-v="${hid?'visivel':'oculto'}">${hid?'Mostrar':'Ocultar'}</button></div>`}).join('')}</div>`:empty('Nenhuma avaliação.')}else body=crudList(t);return`<div class="dhead"><div><h1>Conteúdos</h1><p>Notícias, turismo, telefones úteis, vagas e oportunidades publicadas pela administração.</p></div></div><div class="tabs">${tabs.map(([k,l])=>`<a href="#admin-conteudos" data-act="ctab" data-v="${k}" class="${t===k?'on':''}">${l}</a>`).join('')}</div>${t==='phones'?`<div class="note or" style="margin-bottom:14px">${ic('alert')} Valide cada contato com o órgão responsável antes de marcá-lo como validado.</div>`:''}${body}`}});
ACT.ctab=a=>{S.ctab=a.dataset.v;render(false)};
ACT.hideRev=async a=>{if(await W(setMod('r_'+a.dataset.u+'_'+a.dataset.c,{status:a.dataset.v,decidedAt:now()}),a.dataset.v==='oculto'?'Avaliação ocultada.':'Avaliação visível.')){addLog(a.dataset.v==='oculto'?'Ocultou avaliação':'Restaurou avaliação',compById(a.dataset.c)?.name||'');render(false)}};
V['admin-anuncios']=av('admin-anuncios',{title:'Anúncios',render(){return`<div class="dhead"><div><h1>Anúncios e espaços publicitários</h1><p>Banners exibidos na home, nas ofertas e no diretório, com período de veiculação.</p></div></div>${crudList('ads')}`}});

V['admin-planos']=av('admin-planos',{title:'Planos',live:false,render(){const ps=plans();const subs=allCompanies().filter(c=>c.pub&&c.plan!=='gratuito');return`<div class="dhead"><div><h1>Planos e assinaturas</h1><p>Preços, limites e benefícios configuráveis. A cobrança recorrente será integrada a um gateway futuramente.</p></div><button class="btn btn-p" data-act="planNew">${ic('plus','s')} Novo plano</button></div><div class="grid g3">${ps.map(p=>`<form class="card" data-form="plan" data-id="${esc(p.id)}" style="margin:0"><div class="fld"><label>Nome</label><input type="text" name="name" value="${esc(p.name)}" required></div><div class="fld"><label>Preço (texto exibido)</label><input type="text" name="priceText" value="${esc(p.priceText||'')}" placeholder="Ex.: R$ 49/mês"></div><div class="fgrid"><div class="fld"><label>Limite de fotos</label><input type="number" name="photos" min="0" value="${esc(p.photos??0)}"></div><div class="fld"><label>Promoções simultâneas</label><input type="number" name="promos" min="0" value="${esc(p.promos??0)}"></div></div>${[['reports','Relatórios de visualização'],['advanced','Estatísticas avançadas'],['highlight','Destaque nas categorias'],['events','Divulgação de eventos'],['banners','Banners comerciais']].map(([k,l])=>`<label class="chk sm"><input type="checkbox" name="${k}" ${p[k]?'checked':''}>${l}</label>`).join('')}<div class="fld" style="margin-top:10px"><label>Benefícios extras (um por linha)</label><textarea name="extra" style="min-height:60px">${esc(p.extra||'')}</textarea></div><div class="fld"><label>Ordem</label><input type="number" name="order" value="${esc(p.order??0)}"></div><div class="row between"><button class="btn btn-b btn-sm">Salvar</button>${p.id!=='gratuito'?`<button type="button" class="btn btn-sm btn-g btn-dl" data-act="planDel" data-id="${esc(p.id)}">Excluir</button>`:''}</div></form>`).join('')}</div><h3 style="margin-top:30px">Assinaturas ativas (${subs.length})</h3>${subs.length?`<div class="list">${subs.map(c=>`<div class="li"><div class="grow"><b>${esc(c.name)}</b><div class="sm muted">${esc(planById(c.plan).name)}${c.m?.planSince?' desde '+fmtD(c.m.planSince):''}</div></div>${demoTag(c)}</div>`).join('')}</div>`:empty('Nenhuma assinatura paga.')}<h3 style="margin-top:30px">Pagamentos registrados</h3><p class="sm muted">Registre pagamentos recebidos fora da plataforma; eles compõem a receita nos relatórios.</p>${crudList('payments')}`}});
FORM.plan=async(f,o)=>{const id=f.dataset.id;if(await W(setConfig('plans',b=>{b.items=b.items||[];const i=b.items.findIndex(x=>x.id===id);b.items[i]={...b.items[i],name:o.name,priceText:o.priceText,photos:+o.photos||0,promos:+o.promos||0,reports:o.reports,advanced:o.advanced,highlight:o.highlight,events:o.events,banners:o.banners,extra:o.extra,order:+o.order||0}}),'Plano salvo.'))addLog('Editou plano',o.name)};
ACT.planNew=async()=>{const name=await promptBox('Novo plano','Nome do plano *',{ok:'Criar'});if(!name)return;if(await W(setConfig('plans',b=>{b.items=b.items||[];b.items.push({id:slugify(name)+'-'+genId().slice(-3),name,photos:10,promos:1,order:b.items.length+1})}),'Plano criado.')){addLog('Criou plano',name);render(false)}};
ACT.planDel=async a=>{const p=planById(a.dataset.id);const n=allCompanies().filter(c=>c.plan===p.id).length;if(!await confirmBox(`Excluir o plano ${p.name}?${n?` ${n} empresa(s) estão nele e passarão a usar o primeiro plano da lista.`:''}`,{ok:'Excluir',danger:true}))return;if(await W(setConfig('plans',b=>{b.items=b.items.filter(x=>x.id!==p.id)}),'Plano excluído.')){addLog('Excluiu plano',p.name);render(false)}};

V['admin-relatorios']=av('admin-relatorios',{title:'Relatórios',render(){const all=allCompanies();const pub=all.filter(c=>c.pub);const rows=pub.map(c=>({c,...statsFor(c.id).tot})).sort((a,b)=>b.v-a.v).slice(0,15);return`<div class="dhead"><div><h1>Relatórios e histórico</h1></div></div><div class="grid g2"><div class="card"><h3>Empresas por categoria</h3>${hbars(byCat(all))}</div><div class="card"><h3>Empresas por bairro</h3>${hbars(byBairro(all))}</div></div><div class="card"><h3>Empresas mais vistas</h3>${rows.some(r=>r.v)?`<div class="tblw"><table class="tbl"><thead><tr><th>Empresa</th><th>Visualizações</th><th>WhatsApp</th><th>Telefone</th><th>Como chegar</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.c.pubName)}</td><td>${nf(r.v)}</td><td>${nf(r.w)}</td><td>${nf(r.p)}</td><td>${nf(r.r)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sm muted">Ainda não há visualizações registradas.</p>'}</div><div class="card"><h3>Histórico de ações administrativas</h3>${logTable(S.logs.slice(0,100))}</div>`}});

V['admin-configuracoes']=av('admin-configuracoes',{title:'Configurações',live:false,render(){const s=site();const c=s.colors||{};const def={azc:'#55B7D9',az:'#287DA3',lj:'#E88936',mr:'#79543A',vd:'#718A52',bg:'#F5F0E8',gf:'#29343A'};const lab={azc:'Azul-claro (navegação)',az:'Azul institucional',lj:'Laranja (ações)',mr:'Marrom terroso',vd:'Verde agrícola',bg:'Bege (fundos)',gf:'Grafite (textos)'};return`<div class="dhead"><div><h1>Configurações do portal</h1></div></div><form class="card" data-form="siteCfg"><h3>Identidade</h3><div class="fgrid"><div class="fld"><label for="scN">Nome do portal</label><input id="scN" type="text" name="name" value="${esc(s.name)}"></div><div class="fld"><label for="scC">Cidade</label><input id="scC" type="text" name="city" value="${esc(s.city)}"></div><div class="fld"><label for="scU">Estado (UF)</label><input id="scU" type="text" name="state" value="${esc(s.state)}" maxlength="2"></div><div class="fld"><label for="scE">E-mail de contato</label><input id="scE" type="email" name="email" value="${esc(s.email)}"></div><div class="fld full"><label for="scT">Slogan</label><input id="scT" type="text" name="tagline" value="${esc(s.tagline)}"></div><div class="fld full"><label for="scH">Título do banner</label><input id="scH" type="text" name="heroTitle" value="${esc(s.heroTitle)}"></div><div class="fld full"><label for="scS">Subtítulo do banner</label><input id="scS" type="text" name="heroSub" value="${esc(s.heroSub)}"></div></div><h3 style="margin-top:10px">Cores</h3><div class="grid g4" style="gap:10px">${Object.keys(def).map(k=>`<label class="fld" style="margin:0"><span class="sm">${lab[k]}</span><input type="color" name="c_${k}" value="${esc(c[k]||def[k])}" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff"></label>`).join('')}</div><button type="button" class="btn btn-sm btn-g" data-act="resetColors" style="margin-top:8px">Restaurar paleta oficial</button><h3 style="margin-top:20px">Moderação</h3><label class="chk"><input type="checkbox" name="autoApprovePromos" ${s.autoApprovePromos?'checked':''}> Publicar automaticamente promoções de empresas já aprovadas</label><div class="row" style="margin-top:18px"><button class="btn btn-p">Salvar configurações</button></div></form>`}});
FORM.siteCfg=async(f,o)=>{const colors={};for(const k of['azc','az','lj','mr','vd','bg','gf'])colors[k]=o['c_'+k];if(await W(setConfig('site',b=>{Object.assign(b,{name:o.name,city:o.city,state:o.state.toUpperCase(),email:o.email,tagline:o.tagline,heroTitle:o.heroTitle,heroSub:o.heroSub,autoApprovePromos:o.autoApprovePromos,colors})}),'Configurações salvas.')){applyColors();addLog('Alterou configurações do portal','site');renderFooter()}};
ACT.resetColors=async()=>{if(await W(setConfig('site',b=>{b.colors={}}),'Paleta oficial restaurada.')){applyColors();render(false)}};

</script>
<script>
(async function boot(){
  S.route={n:'inicio',param:null};
  window.addEventListener('hashchange',route);
  renderHeader();renderFooter();route();
  setTimeout(()=>{if(!coreReady()){S.slow=true;render(false)}},10000);
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  for(let i=0;i<(inFrame?40:3)&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  S.C=window.claude;
  if((!S.C||!S.C.use)&&window.__LOCAL_CLAUDE){S.C=window.__LOCAL_CLAUDE;S.local=true;$('#demoBar').innerHTML='Modo local · dados salvos neste navegador · itens com o selo <b>Demonstração</b> são fictícios · <a href="#inicio" style="color:#ffd2a8" onclick="if(confirm(\'Apagar os dados locais e restaurar a demonstração?\'))window.__resetLocalDb();return false">restaurar demonstração</a>'}
  if(!S.C||!S.C.use){S.noDb=true;S.userResolved=true;$('#demoBar').innerHTML='Visualização sem banco de dados — abra o portal pelo seu link para usar todas as funções.';render(false);return}
  try{S.user=await S.C.use('user')}catch(e){S.user=null}
  if(S.user){try{S.uid=(await S.user.id())||null}catch(e){S.uid=null}try{S.owner=!!(await S.user.isOwner())}catch(e){}try{S.admin=S.owner||!!(await S.user.canEdit())}catch(e){}}
  S.userResolved=true;
  try{S.db=await S.C.use('db')}catch(e){S.db=null}
  if(!S.db){S.noDb=true;$('#demoBar').innerHTML='Banco de dados indisponível nesta visualização — entre com sua conta para ver o conteúdo.';render(false);return}
  startSubs();render(false);
})();
</script>
