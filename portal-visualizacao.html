<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portal digital da cidade: empresas, serviços, ofertas, eventos, turismo, empregos e telefones úteis em um só lugar.">
<meta name="theme-color" content="#287DA3">
<title>Portal da Cidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--white:#fff;--azc:#55B7D9;--az:#287DA3;--lj:#E88936;--mr:#79543A;--vd:#718A52;--bg:#F5F0E8;--gf:#29343A;--line:#E8E3DA;--mut:#5c676d;--r:16px;--sh:0 1px 2px rgba(41,52,58,.05),0 10px 30px -12px rgba(41,52,58,.14);--hdr:68px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--gf);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.55;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,h4{font-family:Montserrat,Inter,sans-serif;line-height:1.15;margin:0 0 .45em;letter-spacing:-.015em;font-weight:700}
h1{font-size:clamp(30px,5vw,54px);font-weight:800}
h2{font-size:clamp(22px,3vw,30px)}
h3{font-size:18px}
h4{font-size:16px}
p{margin:0 0 .8em}
a{color:var(--az);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(85,183,217,.65);outline-offset:2px;border-radius:6px}
.wrap{max-width:1220px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}
.sm{font-size:14px}
.xs{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.ic.l{width:26px;height:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:#fff;color:var(--gf);min-height:44px;transition:background .15s,border-color .15s,transform .1s;text-decoration:none!important;white-space:nowrap;font-size:15px}
.btn:hover{border-color:#cfc7b9;background:#fbf9f5}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--lj);border-color:var(--lj);color:#2A1B0E}
.btn-p:hover{background:#de7c28;border-color:#de7c28}
.btn-b{background:var(--az);border-color:var(--az);color:#fff}
.btn-b:hover{background:#1f6a8b;border-color:#1f6a8b}
.btn-v{background:var(--vd);border-color:var(--vd);color:#fff}
.btn-v:hover{background:#5f7744}
.btn-g{background:transparent;border-color:transparent}
.btn-g:hover{background:rgba(41,52,58,.05);border-color:transparent}
.btn-danger{background:#b23a22;border-color:#b23a22;color:#fff}
.btn-danger:hover{background:#962f1b}
.btn-dl{color:#a3341f}
.btn-sm{padding:6px 11px;min-height:36px;font-size:14px;border-radius:10px}
.btn-wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn-wa:hover{background:#188548}
.btn-block{width:100%}

/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:#eef6fa;color:var(--az);border:1px solid #d6ecf5;white-space:nowrap}
.chip-or{background:#fdf0e3;color:#8a4a12;border-color:#f6d9bb}
.chip-vd{background:#eef2e8;color:#4b5e33;border-color:#dbe3cf}
.chip-mr{background:#f3ece6;color:var(--mr);border-color:#e6d8cc}
.chip-gy{background:#f2f2f0;color:#555;border-color:#e4e4e0}
.chip-rd{background:#fbebe7;color:#9a2f1a;border-color:#f2cfc6}
.chip-gn{background:#e8f5ec;color:#1d6b3c;border-color:#cfe8d7}
.demo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mr);background:#f6efe7;border:1px dashed #d8c3ae;padding:2px 7px;border-radius:6px}

/* demo bar */
#demoBar{background:var(--gf);color:#e9eef0;font-size:13px;text-align:center;padding:7px 14px}
#demoBar b{color:#ffd2a8}

/* header */
#hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;color:var(--gf)!important;text-decoration:none!important;flex:none}
.brand svg{width:38px;height:38px}
.brand b{font-family:Montserrat;font-size:17px;display:block;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.hsearch{flex:1;max-width:420px;position:relative}
.hsearch input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:#faf8f4;padding:0 14px 0 40px;font-size:15px}
.hsearch input:focus{background:#fff;border-color:var(--azc);outline:none;box-shadow:0 0 0 4px rgba(85,183,217,.18)}
.hsearch .ic{position:absolute;left:12px;top:11px;color:var(--mut)}
.hact{display:flex;gap:8px;align-items:center;margin-left:auto}
.nav{border-top:1px solid #f0ece5}
.nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav a{display:block;padding:11px 12px;font-size:14.5px;font-weight:600;color:var(--gf);white-space:nowrap;border-bottom:2px solid transparent;text-decoration:none}
.nav a:hover{color:var(--az)}
.nav a.on{border-color:var(--azc);color:var(--az)}
.menuBtn{display:none}
.umenu{position:relative}
.udrop{position:absolute;right:0;top:50px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);min-width:230px;padding:6px;display:none;z-index:50}
.umenu.open .udrop{display:block}
.udrop a,.udrop button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;color:var(--gf);background:none;border:0;cursor:pointer;text-align:left;font-size:15px;text-decoration:none}
.udrop a:hover,.udrop button:hover{background:#f6f3ee}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--az);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

/* drawer */
#drawer{position:fixed;inset:0;z-index:80;display:none}
#drawer.on{display:block}
#drawer .bk{position:absolute;inset:0;background:rgba(20,28,32,.45)}
#drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(86vw,340px);background:#fff;padding:18px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
#drawer .pn a{display:flex;gap:12px;align-items:center;padding:12px 10px;border-radius:10px;color:var(--gf);font-weight:600;text-decoration:none}
#drawer .pn a:hover{background:#f6f3ee}

/* bottom nav */
#bottomNav{display:none}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#f8fbfd 0%,#fff 55%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero .wrap{position:relative;padding-top:64px;padding-bottom:56px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero svg.bgart{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--az);margin-bottom:14px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--lj);border-radius:2px}
.hero h1 span{color:var(--az)}
.hero .lead{font-size:clamp(16px,2vw,19px);color:#46535a;max-width:560px}
.sbox{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:10px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px}
.sbox .f{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:#faf8f4;border:1px solid transparent}
.sbox .f:focus-within{border-color:var(--azc);background:#fff}
.sbox input,.sbox select{border:0;background:transparent;height:48px;width:100%;outline:none;font-size:15px;min-width:0}
.sbox .btn{height:50px;padding:0 22px}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.qchips a{display:inline-flex;gap:7px;align-items:center;padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--gf);text-decoration:none}
.qchips a:hover{border-color:var(--azc);color:var(--az)}
.hcard{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:22px;position:relative}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.hstats div{background:var(--bg);border-radius:14px;padding:14px}
.hstats b{display:block;font-family:Montserrat;font-size:26px;line-height:1}
.hstats span{font-size:12.5px;color:var(--mut)}

/* sections */
.sec{padding:52px 0}
.sec.alt{background:var(--bg)}
.sec.agro{background:linear-gradient(135deg,#f1f4ec,#fff 70%);border-top:1px solid #e3e9da;border-bottom:1px solid #e3e9da}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:22px}
.sec-h h2{margin:0}
.sec-h p{margin:.3em 0 0;color:var(--mut)}
.sec-h a{font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--gf);text-decoration:none!important;transition:.15s;cursor:pointer;text-align:left}
.cat:hover{border-color:var(--azc);box-shadow:var(--sh);transform:translateY(-2px)}
.cat .ci{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.cat b{font-size:15px;line-height:1.25}
.cat small{color:var(--mut);font-size:12.5px}

.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.ccard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;color:var(--gf)!important;text-decoration:none!important;transition:.18s}
.ccard:hover{box-shadow:var(--sh);transform:translateY(-3px);border-color:#ddd5c7}
.ccover{height:128px;position:relative;background-size:cover;background-position:center}
.ccover .tags{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.clogo{position:absolute;left:14px;bottom:-22px;width:56px;height:56px;border-radius:14px;border:3px solid #fff;background:#fff;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.clogo.ph{display:grid;place-items:center;font-family:Montserrat;font-weight:800;color:#fff;font-size:19px}
.cbody{padding:30px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{font-size:16.5px;margin:0;display:flex;gap:6px;align-items:center}
.cbody h3 .ic{color:var(--az)}
.cbody p{margin:0}
.cmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.stars{color:#c87a1f;font-weight:700;font-size:13.5px;display:inline-flex;gap:3px;align-items:center}

.pcard{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);color:var(--gf)!important;text-decoration:none!important;transition:.18s}
.pcard:hover{box-shadow:var(--sh);transform:translateY(-3px)}
.pimg{height:150px;background-size:cover;background-position:center;position:relative}
.pct{position:absolute;left:12px;top:12px;background:var(--lj);color:#2A1B0E;font-weight:800;font-family:Montserrat;padding:5px 11px;border-radius:10px;font-size:14px}
.pbody{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pbody h4{margin:0;font-size:16px}
.price{display:flex;gap:8px;align-items:baseline;margin-top:auto;padding-top:6px}
.price s{color:var(--mut);font-size:14px}
.price b{font-family:Montserrat;font-size:20px;color:#b25f17}

.ecard{display:flex;gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--gf)!important;text-decoration:none!important;align-items:flex-start;transition:.15s}
.ecard:hover{box-shadow:var(--sh)}
.edate{flex:none;width:62px;text-align:center;border-radius:12px;background:#eef6fa;color:var(--az);padding:8px 0;font-family:Montserrat}
.edate b{display:block;font-size:24px;line-height:1}
.edate span{font-size:12px;text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.ecard h4{margin:0 0 4px}

.ncard{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#fff;color:var(--gf)!important;text-decoration:none!important}
.ncard .ni{height:160px;background-size:cover;background-position:center}
.ncard .nb{padding:16px}
.ncard:hover{box-shadow:var(--sh)}

.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.li .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:#eef6fa;color:var(--az)}

.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.zone{padding:18px;border-radius:var(--r);background:#fff;border:1px solid var(--line);cursor:pointer;text-align:left;transition:.15s}
.zone:hover{border-color:var(--azc);box-shadow:var(--sh)}
.zone h4{margin:0 0 4px;display:flex;align-items:center;gap:8px}
.zone .bx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.cta{border-radius:28px;background:linear-gradient(120deg,var(--az),#1c5e7d 60%,#24506a);color:#fff;padding:42px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.cta h2{color:#fff}
.cta p{color:#d7e9f1}
.cta .art{position:absolute;right:-40px;bottom:-60px;width:320px;opacity:.18}

.empty{padding:28px;border:1px dashed #d9d1c4;border-radius:var(--r);text-align:center;color:var(--mut);background:#fdfcfa}
.empty b{display:block;color:var(--gf);margin-bottom:4px}

.ad{display:flex;gap:18px;align-items:center;justify-content:space-between;border-radius:20px;padding:22px 26px;background:linear-gradient(110deg,#fff7ef,#fdeedd);border:1px solid #f4dcc2;color:var(--gf)!important;text-decoration:none!important;overflow:hidden;position:relative}
.ad img{max-height:120px;border-radius:12px}
.ad .lbl{position:absolute;right:10px;top:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9b7b5b}

/* page header */
.ph{padding:34px 0 22px;background:linear-gradient(180deg,#f8fbfd,#fff);border-bottom:1px solid var(--line)}
.ph h1{font-size:clamp(26px,4vw,38px);margin-bottom:6px}
.crumb{font-size:13.5px;color:var(--mut);margin-bottom:8px}
.crumb a{color:var(--mut)}

/* directory */
.dir{display:grid;grid-template-columns:290px 1fr;gap:26px;padding:26px 0 60px}
.filters{position:sticky;top:calc(var(--hdr) + 60px);align-self:start;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:#fff;max-height:calc(100vh - 150px);overflow:auto}
.filters h4{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
.filters h4:first-child{margin-top:0}
.chk{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--az)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label,.lbl2{font-weight:600;font-size:14px}
.fld .hint{font-size:12.5px;color:var(--mut)}
.inp,.fld input[type=text],.fld input[type=email],.fld input[type=tel],.fld input[type=url],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=search],.fld select,.fld textarea,select.inp{width:100%;border:1px solid #ddd6ca;border-radius:12px;padding:11px 13px;background:#fff;font-size:15.5px;min-height:46px}
.fld textarea{min-height:110px;resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--azc);box-shadow:0 0 0 4px rgba(85,183,217,.18)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:#c4472c}
.fld .em{color:#a3341f;font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.fgrid .full{grid-column:1/-1}
.fg3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}
.card h3{margin-bottom:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}

/* steps */
.steps{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.steps a{flex:1;min-width:120px;display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--mut);font-weight:600;font-size:14px;text-decoration:none}
.steps a b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#f0ece5;font-size:12.5px;flex:none}
.steps a.on{border-color:var(--az);color:var(--az);background:#f3f9fc}
.steps a.on b{background:var(--az);color:#fff}
.steps a.ok b{background:var(--vd);color:#fff}

/* dashboard */
.dash{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 140px)}
.side{border-right:1px solid var(--line);background:#fcfbf8;padding:18px 12px;position:sticky;top:var(--hdr);align-self:start;height:calc(100vh - var(--hdr));overflow:auto}
.side a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;color:#3a464c;font-weight:600;font-size:14.5px;text-decoration:none}
.side a:hover{background:#f2eee7}
.side a.on{background:#e9f4f9;color:var(--az)}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .cnt{margin-left:auto;background:var(--lj);color:#2A1B0E;border-radius:99px;font-size:12px;padding:1px 8px}
.side .ttl{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);padding:8px 12px 4px;font-weight:700}
.dmain{padding:26px clamp(16px,3vw,36px) 80px;min-width:0;background:#fff}
.dmain>h1,.dhead h1{font-size:clamp(22px,3vw,30px)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.dhead p{margin:4px 0 0;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.kpi span{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.kpi b{display:block;font-family:Montserrat;font-size:28px;margin-top:6px;line-height:1.1}
.switcher{width:100%;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px 10px;border-bottom:1px solid #f1ede6;vertical-align:middle}
.tbl tr:hover td{background:#fcfbf8}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding:10px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--azc);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--az)}
.hbars .hb{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.hbars .hb i{display:block;height:10px;border-radius:6px;background:var(--azc)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--az);border-color:var(--az)}
.note{padding:12px 14px;border-radius:12px;background:#eef6fa;border:1px solid #d6ecf5;color:#1d5670;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.or{background:#fdf3e8;border-color:#f6dcc0;color:#7a4413}
.note.rd{background:#fbebe7;border-color:#f2cfc6;color:#8d2b17}
.note.vd{background:#eef2e8;border-color:#dbe3cf;color:#44562d}
.note .ic{margin-top:1px}
.progress{height:8px;border-radius:9px;background:#efebe4;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--vd),var(--azc))}

/* gallery */
.drop{border:2px dashed #cfd9de;border-radius:16px;padding:26px;text-align:center;background:#f9fcfd;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--az);background:#eef7fb}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.gi{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;position:relative}
.gi img{width:100%;height:130px;object-fit:cover}
.gi .gb{padding:8px;display:flex;flex-direction:column;gap:6px}
.gi .gb input{border:1px solid #e1dbd0;border-radius:8px;padding:6px 8px;font-size:13.5px;width:100%}
.gi .ga{display:flex;gap:4px;flex-wrap:wrap}
.gi .ga button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;cursor:pointer;display:grid;place-items:center}
.gi .ga button:hover{background:#f5f2ec}
.gi.main{outline:3px solid var(--lj)}
.gi .mt{position:absolute;left:8px;top:8px}
.gi.dragging{opacity:.4}

/* company page */
.cp-cover{height:clamp(200px,30vw,340px);background-size:cover;background-position:center;position:relative}
.cp-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.cp-head{display:flex;gap:20px;align-items:flex-start;margin-top:-64px;position:relative;z-index:2;flex-wrap:wrap}
.cp-logo{width:124px;height:124px;border-radius:26px;border:5px solid #fff;background:#fff;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.15);flex:none}
.cp-logo.ph{display:grid;place-items:center;font-family:Montserrat;font-weight:800;color:#fff;font-size:40px}
.cp-title{padding-top:76px;flex:1;min-width:240px}
.cp-title h1{font-size:clamp(26px,4vw,40px);margin:0 0 6px}
.cp-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}
.cp-grid{display:grid;grid-template-columns:1fr 360px;gap:26px;padding-bottom:60px}
.cp-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cp-gal button{padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#eee;aspect-ratio:4/3}
.cp-gal img{width:100%;height:100%;object-fit:cover}
.hours{width:100%;font-size:14.5px;border-collapse:collapse}
.hours td{padding:6px 0;border-bottom:1px dashed #ece6dc}
.hours tr.today td{font-weight:700;color:var(--az)}
.prod{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;align-items:center}
.prod img,.prod .pi{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--mr)}
.mapbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#f4f1ea}
.preview-banner{background:#fff6ea;border-bottom:1px solid #f3dcbf;color:#7a4413;padding:10px 0;font-size:14px}

/* map */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#f3efe7}
.mapwrap svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin:hover circle{r:9}

/* modal */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.on{display:block}
.mback{position:absolute;inset:0;background:rgba(20,28,32,.5)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,96vw)}
.modal .mx{position:absolute;right:14px;top:14px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.lightbox img{max-height:76vh;margin:0 auto;border-radius:12px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--gf);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh);font-size:14.5px;max-width:90vw;animation:tin .2s ease}
.toast.err{background:#9a2f1a}
.toast.ok{background:#3f5a2a}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

.skel{background:linear-gradient(90deg,#f1ede6,#f8f6f2,#f1ede6);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}

footer{background:#1f2a2f;color:#c9d3d7;padding:48px 0 30px;margin-top:0}
footer a{color:#e3eaed}
footer h4{color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:26px}
.fcols ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.fbot{border-top:1px solid #34434a;margin-top:30px;padding-top:18px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

.article{max-width:760px;margin:0 auto;padding:30px 20px 70px;font-size:17px}
.article img.hero-img{border-radius:18px;margin:10px 0 22px;width:100%;max-height:420px;object-fit:cover}

@media (max-width:1060px){
  .g4{grid-template-columns:repeat(3,1fr)}
  .hero .wrap{grid-template-columns:1fr}
  .hero .hcard{display:none}
  .cp-grid{grid-template-columns:1fr}
}

  .dash{grid-template-columns:1fr}

  .side .sep,.side .ttl{display:none}

  .sbox{grid-template-columns:1fr 1fr}
  .sbox .f:first-child{grid-column:1/-1}
  .sbox .btn{grid-column:1/-1}
  .cta{grid-template-columns:1fr;padding:28px}
  .fcols{grid-template-columns:1fr 1fr}
  #bottomNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottomNav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut);padding:4px;text-decoration:none}
  #bottomNav a.on{color:var(--az)}
  body{padding-bottom:70px}
  .cp-actions{grid-template-columns:repeat(2,1fr)}
  .hero .wrap{padding-top:40px;padding-bottom:40px}
  .sec{padding:38px 0}
}
@media (max-width:560px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .catgrid{grid-template-columns:repeat(2,1fr)}
  .fgrid,.fg3{grid-template-columns:1fr}
  .brand small{display:none}
  .hact .btn-p span{display:none}
  .ccover{height:110px}
  .hbars .hb{grid-template-columns:100px 1fr 34px}
  .modal{padding:20px;border-radius:18px}
  .cp-logo{width:96px;height:96px}
  .cp-title{padding-top:6px;min-width:100%}
  #demoBar{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

(function(){

  function query(path){const n=path.split('/').length;const docs=[...store.entries()].filter(([k])=>k.startsWith(path+'/')&&k.split('/').length===n+1).map(([k,v])=>snapDoc(k.split('/').pop(),v));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}}

  function docRef(path){const id=path.split('/').pop();return{path,id,get:async()=>snapDoc(id,store.get(path)),set:async d=>{store.set(path,JSON.parse(JSON.stringify(d)));persist();notify()},update:async d=>{if(!store.has(path))throw{code:'invalid_argument'};store.set(path,{...store.get(path),...JSON.parse(JSON.stringify(d))});persist();notify()},delete:async()=>{store.delete(path);persist();notify()},onSnapshot(next){const f=()=>next(snapDoc(id,store.get(path)));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},collection:p=>coll(path+'/'+p)}}
  const db={doc:docRef,collection:coll};
  const user={id:async()=>'local-admin',isOwner:()=>true,canEdit:()=>true,can:()=>true,me:async()=>({id:'local-admin'}),profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i==='local-admin'?'Administrador local':''}]))};

}

function mutate(path,get,setLocal,fn){if(!S.db)return Promise.reject({code:'not_granted'});const p=(Q[path]||Promise.resolve()).then(()=>{const base=clone(get()||{});fn(base);base.updatedAt=now();setLocal(base);bump();return S.db.doc(path).set(base)});Q[path]=p.catch(()=>{});return p}
const mutateMy=fn=>S.uid?mutate('companies/'+S.uid,()=>S.owners[S.uid]||{companies:{},promos:{},events:{},jobs:{}},v=>S.owners[S.uid]=v,fn):Promise.reject({code:'invalid_argument'});
const mutatePriv=fn=>S.uid?mutate('private/'+S.uid,()=>S.me,v=>S.me=v,fn):Promise.reject({code:'invalid_argument'});
const setMod=(id,patch)=>mutate('moderation/'+id,()=>S.mod[id],v=>S.mod[id]=v,b=>Object.assign(b,patch,{by:S.uid}));
const setConfig=(id,fn)=>mutate('config/'+id,()=>S.cfg[id],v=>S.cfg[id]=v,fn);
async function saveColl(coll,id,data){const p=S.db.collection(coll).doc(id).set(data);return p}
async function delColl(coll,id){return S.db.collection(coll).doc(id).delete()}
function addLog(action,target,detail=''){if(!S.admin||!S.db)return;S.db.collection('logs').add({at:now(),by:S.uid,action,target,detail}).catch(()=>{})}
async function W(p,okMsg){try{await p;if(okMsg)toast(okMsg,'ok');return true}catch(e){const c=e?.code;toast(c==='invalid_argument'?'Sem permissão para salvar ou dados inválidos.':c==='quota_exceeded'?'Limite de armazenamento atingido. Remova itens antigos e tente de novo.':c==='resource_exhausted'?'Muitas operações seguidas. Aguarde alguns segundos.':c==='not_granted'?'Banco de dados indisponível nesta visualização.':'Não foi possível salvar. Tente novamente.','err');console.warn(e);return false}}

/* métricas reais: um documento por visitante (metrics/<id>), somado por empresa */
const PEND={};let flushT=null;
function track(cid,k){if(!S.db||!S.uid)return;const c=compById(cid);if(!c||c.ownerId===S.uid||!c.pub)return;(PEND[cid]=PEND[cid]||{})[k]=(PEND[cid][k]||0)+1;clearTimeout(flushT);flushT=setTimeout(flushMetrics,1500)}
function flushMetrics(){const inc=clone(PEND);for(const k in PEND)delete PEND[k];if(!Object.keys(inc).length)return;mutate('metrics/'+S.uid,()=>S.metrics[S.uid],v=>S.metrics[S.uid]=v,b=>{b.c=b.c||{};const dk=dayKey();for(const[cid,o]of Object.entries(inc)){const x=b.c[cid]||(b.c[cid]={d:{}});x.d=x.d||{};const d=x.d[dk]||(x.d[dk]={});for(const[k,n]of Object.entries(o)){x[k]=(x[k]||0)+n;d[k]=(d[k]||0)+n}const ks=Object.keys(x.d).sort();while(ks.length>90)delete x.d[ks.shift()]}}).catch(()=>{})}

/* imagens: compressão, conversão para WebP e envio ao armazenamento */
async function getAssets(){if(S.assets!==undefined)return S.assets;try{S.assets=await S.C.use('assets')}catch(e){S.assets=null}return S.assets}
async function processImage(file,{max=1600,q=.82}={}){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error('Formato não suportado. Use JPG, PNG ou WebP.');if(file.size>10*1024*1024)throw new Error('Arquivo acima de 10 MB.');const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Imagem inválida.'));i.src=url});const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);let blob=await new Promise(r=>cv.toBlob(r,'image/webp',q));if(!blob||blob.type!=='image/webp')blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));return{blob,cv}}
async function uploadImage(file,opts={}){const{blob,cv}=await processImage(file,opts);const A=await getAssets();if(A){const r=await A.upload(blob);return{id:r.id,url:r.url||('/_blob/'+r.id),size:r.sizeBytes}}if(opts.inline){const small=document.createElement('canvas');const s=Math.min(1,(opts.inlineMax||256)/Math.max(cv.width,cv.height));small.width=Math.round(cv.width*s);small.height=Math.round(cv.height*s);small.getContext('2d').drawImage(cv,0,0,small.width,small.height);return{id:null,url:small.toDataURL('image/webp',.7)}}throw new Error('O envio de imagens não está disponível para o seu nível de acesso nesta visualização.')}
async function deleteAsset(img){if(!img?.id)return;try{const A=await getAssets();await A?.delete(img.id)}catch(e){}}

/* ---------- UI básicos ---------- */
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.setAttribute('role','status');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3600)}
function modal(html,{wide=false}={}){const r=$('#modalRoot');r.innerHTML=`<div class="mback" data-act="mNo"></div><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><button class="btn btn-g btn-sm mx" data-act="mNo" aria-label="Fechar">${ic('x')}</button>${html}</div>`;r.classList.add('on');document.body.style.overflow='hidden';setTimeout(()=>{const f=$('.modal [autofocus]',r)||$('.modal input,.modal textarea,.modal select',r);f?.focus()},40)}
function closeModal(){const r=$('#modalRoot');r.classList.remove('on');r.innerHTML='';document.body.style.overflow=''}
let modalRes=null;
function confirmBox(msg,{ok='Confirmar',danger=false,title='Confirmar ação'}={}){return new Promise(res=>{modalRes=res;modal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="mact"><button class="btn" data-act="mNo">Cancelar</button><button class="btn ${danger?'btn-danger':'btn-p'}" data-act="mYes" autofocus>${esc(ok)}</button></div>`)})}
function promptBox(title,label,{ok='Confirmar',required=true,danger=false}={}){return new Promise(res=>{modalRes=v=>res(v?($('#promptVal')?.value||'').trim():null);modal(`<h3>${esc(title)}</h3><div class="fld"><label for="promptVal">${esc(label)}</label><textarea id="promptVal" ${required?'required':''}></textarea></div><div class="mact"><button class="btn" data-act="mNo">Cancelar</button><button class="btn ${danger?'btn-danger':'btn-p'}" data-act="mYesP">${esc(ok)}</button></div>`)})}
const statusChip=(map,s)=>{const[l,c]=map[s]||[s,'chip-gy'];return`<span class="chip ${c}">${esc(l)}</span>`};
const empty=(t,s='',a='')=>`<div class="empty"><b>${esc(t)}</b>${s?`<span class="sm">${s}</span>`:''}${a?`<div style="margin-top:12px">${a}</div>`:''}</div>`;
const demoTag=x=>x?.demo?'<span class="demo" title="Dado fictício para demonstração">Demonstração</span>':'';
function stars(r){if(!r)return'';return`<span class="stars">${ic('star','s')} ${r.avg.toFixed(1).replace('.',',')} <span class="muted" style="font-weight:500">(${r.n})</span></span>`}
function logoEl(c,cls='clogo',st=''){const u=safeImg(c.logo?.url);return u?`<img class="${cls}" src="${u}" alt="Logo de ${esc(c.pubName||c.name)}" style="${st}">`:`<span class="${cls} ph" style="background:${catColor(c.pubCat||c.mainCat)};${st}">${esc(initials(c.pubName||c.name))}</span>`}
function cCard(c){const o=isOpen(c);const r=ratingOf(c.id);const hasPromo=activePromos().some(p=>p.companyId===c.id);return`<a class="ccard" href="#empresa-${esc(c.slug)}"><div class="ccover" style="${coverStyle(c)}"><div class="tags">${c.featured?'<span class="chip chip-or">Destaque</span>':''}${hasPromo?`<span class="chip chip-or">${ic('tag','s')}Oferta</span>`:''}</div>${logoEl(c)}</div><div class="cbody"><h3>${esc(c.pubName)}${c.verified?`<span title="Empresa verificada">${ic('shield','s')}</span>`:''}</h3><p class="muted sm">${esc(catName(c.pubCat))}${c.loc?.bairro?' · '+esc(bairroName(c.loc.bairro)):''}</p><div class="cmeta">${o===true?'<span class="chip chip-gn">Aberto agora</span>':o===false?'<span class="chip chip-gy">Fechado</span>':''}${c.estab==='domiciliar'?'<span class="chip">Atende em domicílio</span>':''}${stars(r)}${demoTag(c)}</div></div></a>`}
function pCard(p){const c=p.company||{};const pct=discount(p);const u=safeImg(p.image?.url);return`<a class="pcard" href="#empresa-${esc(c.slug)}"><div class="pimg" style="${u?`background-image:url('${u}')`:coverStyle(c)}"><span class="pct">${pct?'-'+pct+'%':esc(PROMO_TYPES[p.type]||'Oferta')}</span></div><div class="pbody"><h4>${esc(p.title)}</h4><p class="muted sm" style="margin:0">${esc(c.pubName||'')}${c.loc?.bairro?' · '+esc(bairroName(c.loc.bairro)):''}</p><div class="price">${num(p.priceFrom)&&num(p.priceTo)?`<s>${money(num(p.priceFrom))}</s>`:''}${num(p.priceTo)?`<b>${money(num(p.priceTo))}</b>`:''}</div><p class="xs muted" style="margin:0">${p.end?'Válida até '+fmtD(p.end):''} ${demoTag(c)}</p></div></a>`}
function eCard(e){const d=new Date((e.date||'')+'T12:00:00');const ok=!isNaN(d);return`<a class="ecard" href="#evento-${esc(e.id)}"><div class="edate">${ok?`<b>${pad(d.getDate())}</b><span>${MONTHS[d.getMonth()]}</span>`:'<b>—</b>'}</div><div><span class="chip chip-mr" style="margin-bottom:6px">${esc(e.type||'Evento')}</span><h4>${esc(e.title)}</h4><p class="sm muted" style="margin:0">${ic('pin','s')} ${esc(e.place||'')}${e.time?' · '+esc(e.time):''}</p>${demoTag(e)}</div></a>`}
function nCard(n){const u=safeImg(n.image?.url);return`<a class="ncard" href="#noticia-${esc(n.id)}"><div class="ni" style="${u?`background-image:url('${u}')`:'background:linear-gradient(135deg,var(--azc),var(--az))'}"></div><div class="nb"><span class="chip">${esc(n.category||'Cidade')}</span><h4 style="margin:10px 0 6px">${esc(n.title)}</h4><p class="sm muted" style="margin:0">${esc(n.summary||'')}</p><p class="xs muted" style="margin:8px 0 0">${fmtD(n.publishedAt)} ${demoTag(n)}</p></div></a>`}
function jobItem(j){return`<div class="li" style="align-items:flex-start"><div class="ico">${ic('brief')}</div><div class="grow"><h4 style="margin:0">${esc(j.title)}</h4><p class="sm muted" style="margin:2px 0 6px">${esc(j.company?.pubName||j.companyName||'')}${j.location?' · '+esc(j.location):''}</p><div class="row">${j.mode?`<span class="chip">${esc(j.mode)}</span>`:''}${j.contract?`<span class="chip chip-mr">${esc(j.contract)}</span>`:''}${j.deadline?`<span class="chip chip-gy">Inscrições até ${fmtD(j.deadline)}</span>`:''}${demoTag(j)}</div><details style="margin-top:8px"><summary class="sm" style="cursor:pointer;color:var(--az);font-weight:600">Ver detalhes e como se candidatar</summary><div class="sm" style="margin-top:8px;white-space:pre-line">${esc(j.description||'')}${j.requirements?'\n\nRequisitos:\n'+esc(j.requirements):''}\n\nComo se candidatar: ${esc(j.apply||'—')}</div></details></div></div>`}
function phoneItem(p){const n=digits(p.number);return`<div class="li"><div class="ico">${ic('phone')}</div><div class="grow"><b>${esc(p.name)}</b><div class="sm muted">${esc(p.category||'')}${p.address?' · '+esc(p.address):''}${p.hours?' · '+esc(p.hours):''}</div>${p.validated?'':'<span class="chip chip-or" style="margin-top:4px">Aguardando validação</span>'}</div>${n?`<a class="btn btn-b btn-sm" href="tel:${n}" aria-label="Ligar para ${esc(p.name)}">${ic('phone','s')} ${esc(p.number)}</a>`:'<span class="sm muted">Número a confirmar</span>'}</div>`}
const skeletons=(n=4,h=220)=>`<div class="grid g4">${Array.from({length:n},()=>`<div class="skel" style="height:${h}px"></div>`).join('')}</div>`;
function formObj(f){const o={};const fd=new FormData(f);for(const[k,v]of fd.entries()){if(v instanceof File)continue;if(k.endsWith('[]')){(o[k.slice(0,-2)]=o[k.slice(0,-2)]||[]).push(v)}else o[k]=typeof v==='string'?v.trim():v}$$('input[type=checkbox]',f).forEach(c=>{if(c.name&&!c.name.endsWith('[]'))o[c.name]=c.checked});$$('input[type=checkbox][name$="[]"]',f).forEach(c=>{const k=c.name.slice(0,-2);if(!(k in o))o[k]=[]});return o}
function fieldErr(form,name,msg){const el=form.querySelector(`[name="${name}"]`);const fl=el?.closest('.fld');if(fl){fl.classList.add('err');let m=fl.querySelector('.em');if(!m){m=document.createElement('span');m.className='em';fl.appendChild(m)}m.textContent=msg}if(el)el.setAttribute('aria-invalid','true')}
function clearErr(form){$$('.fld.err',form).forEach(f=>{f.classList.remove('err');f.querySelector('.em')?.remove()});$$('[aria-invalid]',form).forEach(e=>e.removeAttribute('aria-invalid'))}
function applyColors(){const c=S.cfg.site?.colors||{};const map={azc:'--azc',az:'--az',lj:'--lj',mr:'--mr',vd:'--vd',bg:'--bg',gf:'--gf'};for(const[k,v]of Object.entries(map)){if(c[k]&&/^#[0-9a-f]{6}$/i.test(c[k]))document.documentElement.style.setProperty(v,c[k]);else document.documentElement.style.removeProperty(v)}}
async function fillNames(root=document){if(!S.user)return;const els=$$('[data-uname]',root);const ids=[...new Set(els.map(e=>e.dataset.uname))].filter(Boolean);if(!ids.length)return;try{const ps=await S.user.profiles(ids);els.forEach(e=>{const n=ps?.[e.dataset.uname]?.name;if(n)e.textContent=n})}catch(e){}}

<script>
/* Portal da Cidade — shell, roteador e páginas públicas */
'use strict';
const V={};
const ACT={},FORM={};
const go=h=>{if(location.hash==='#'+h)route();else location.hash=h};
const ph=(t,s='',crumb='')=>`<div class="ph"><div class="wrap">${crumb?`<div class="crumb">${crumb}</div>`:''}<h1>${t}</h1>${s?`<p class="muted" style="margin:0;max-width:720px">${s}</p>`:''}</div></div>`;
const sec=(title,sub,link,body,cls='')=>`<section class="sec ${cls}"><div class="wrap"><div class="sec-h"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${link?`<a href="${link[0]}">${link[1]} ${ic('right','s')}</a>`:''}</div>${body}</div></section>`;
const fAttr=o=>`data-f="${esc(JSON.stringify(o))}"`;

/* ---------- shell ---------- */
const NAV=[['categorias','Categorias'],['empresas','Empresas'],['servicos','Serviços'],['eventos','Eventos'],['turismo','Turismo'],['ofertas','Ofertas'],['telefones-uteis','Telefones úteis'],['empregos','Empregos'],['noticias','Notícias'],['mapa','Mapa']];
function renderHeader(){const h=$('#hdr');if(h.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')return;const st=site();const n=S.route?.n||'';const me=S.me;const uname=me?.name||'';h.innerHTML=`<div class="wrap hbar"><a class="brand" href="#inicio" aria-label="${esc(st.name)} — início">${LOGO}<span><b>${esc(st.name)}</b><small>${esc(st.city)}${st.state?' – '+esc(st.state):''}</small></span></a>
<form class="hsearch" data-form="hdrSearch" role="search">${ic('search')}<input name="q" type="search" placeholder="Buscar empresas, serviços, produtos…" aria-label="Buscar no portal" value="${esc(S.f.q)}"></form>
<div class="hact"><a class="btn btn-p hide-m" href="#${S.uid&&me?.acceptedAt?'painel-nova':'cadastro'}">${ic('store','s')}<span>Cadastre sua empresa</span></a>
${S.uid?`<div class="umenu" id="umenu"><button class="btn btn-g" data-act="umenu" aria-haspopup="true" aria-label="Menu da conta"><span class="avatar">${esc(initials(uname||'Você'))}</span></button><div class="udrop"><div class="sm muted" style="padding:8px 12px">${esc(uname||'Conta conectada')}</div><a href="#painel">${ic('grid','s')} Painel do empresário</a>${S.admin?`<a href="#admin">${ic('shield','s')} Administração</a>`:''}<a href="#painel-config">${ic('cog','s')} Configurações da conta</a></div></div>`:`<a class="btn hide-m" href="#entrar">${ic('user','s')} Entrar</a>`}
<button class="btn btn-g menuBtn" data-act="drawer" aria-label="Abrir menu">${ic('menu')}</button></div></div>
<nav class="nav" aria-label="Seções do portal"><div class="wrap">${NAV.map(([k,l])=>`<a href="#${k}" class="${n===k||n.startsWith(k.slice(0,-1)+'*')?'on':''}">${l}</a>`).join('')}</div></nav>`;
 $('#bottomNav').innerHTML=[['inicio','home','Início'],['empresas','search','Buscar'],['ofertas','tag','Ofertas'],['eventos','cal','Eventos'],[S.uid?'painel':'entrar','user',S.uid?'Painel':'Entrar']].map(([k,i,l])=>`<a href="#${k}" class="${n===k?'on':''}">${ic(i)}${l}</a>`).join('');}
function renderDrawer(){$('#drawer').innerHTML=`<div class="bk" data-act="drawerClose"></div><div class="pn" role="dialog" aria-label="Menu"><div class="row between" style="margin-bottom:10px"><b>${esc(site().name)}</b><button class="btn btn-g btn-sm" data-act="drawerClose" aria-label="Fechar">${ic('x')}</button></div><form data-form="hdrSearch" class="fld"><input name="q" type="search" class="inp" placeholder="Buscar na cidade" aria-label="Buscar"></form>${[['inicio','home','Início'],...NAV.map(([k,l])=>[k,{categorias:'layers',empresas:'store',servicos:'brief',eventos:'cal',turismo:'travel',ofertas:'tag','telefones-uteis':'phone',empregos:'brief',noticias:'news',mapa:'map'}[k],l]),['bairros','pin','Bairros e zonas'],['planos','star','Planos para empresas']].map(([k,i,l])=>`<a href="#${k}">${ic(i)}${l}</a>`).join('')}<div style="height:1px;background:var(--line);margin:10px 0"></div><a class="btn btn-p btn-block" href="#${S.uid?'painel-nova':'cadastro'}" style="justify-content:center;color:#2A1B0E">Cadastre sua empresa</a>${S.uid?`<a href="#painel">${ic('grid')}Painel do empresário</a>${S.admin?`<a href="#admin">${ic('shield')}Administração</a>`:''}`:`<a href="#entrar">${ic('user')}Entrar</a>`}</div>`}
function renderFooter(){const st=site();$('#ftr').innerHTML=`<div class="wrap"><div class="fcols"><div><div class="row" style="margin-bottom:10px">${LOGO.replace('<svg','<svg width="34" height="34"')}<b style="color:#fff;font-family:Montserrat;font-size:18px">${esc(st.name)}</b></div><p class="sm">${esc(st.tagline)}. O guia digital de ${esc(st.city)} para moradores, turistas e empresas.</p>${st.email?`<p class="sm">Contato: ${esc(st.email)}</p>`:''}</div><div><h4>Explorar</h4><ul><li><a href="#empresas">Empresas</a></li><li><a href="#ofertas">Ofertas</a></li><li><a href="#eventos">Eventos</a></li><li><a href="#turismo">Turismo</a></li><li><a href="#bairros">Bairros</a></li></ul></div><div><h4>Utilidade</h4><ul><li><a href="#telefones-uteis">Telefones úteis</a></li><li><a href="#empregos">Empregos</a></li><li><a href="#noticias">Notícias</a></li><li><a href="#mapa">Mapa</a></li></ul></div><div><h4>Para empresas</h4><ul><li><a href="#cadastro">Cadastre sua empresa</a></li><li><a href="#planos">Planos</a></li><li><a href="#painel">Painel do empresário</a></li><li><a href="#termos">Termos de uso</a></li><li><a href="#privacidade">Privacidade e LGPD</a></li></ul></div></div><div class="fbot"><span>© ${new Date().getFullYear()} ${esc(st.name)} · ${esc(st.city)}</span><span>Protótipo funcional — dados marcados como “Demonstração” são fictícios.</span></div></div>`}

/* ---------- roteador ---------- */
function parseRoute(){const h=decodeURIComponent(location.hash.replace(/^#/,''))||'inicio';if(V[h])return[h,null];for(const p of['empresa','categoria','evento','noticia','turismo']){if(h.startsWith(p+'-')&&V[p+'*'])return[p+'*',h.slice(p.length+1)]}return['404',h]}
function route(){const[n,param]=parseRoute();S.route={n,param};$('#drawer').classList.remove('on');$('#umenu')?.classList.remove('open');render(true)}
let wasReady=false;
function render(nav){const{n,param}=S.route;let v=V[n]||V['404'];const app=$('#app');let html;
 const st=site();
 if(v.auth&&S.uid===null&&S.userResolved){html=needLogin()}
 else if(v.auth==='admin'&&S.userResolved&&!S.admin){html=ph('Acesso restrito')+`<div class="wrap sec">${empty('Você não tem permissão de administrador.','A administração é liberada para quem tem nível Editor ou Proprietário neste portal.')}</div>`}
 else if(!coreReady()||(v.auth&&!S.userResolved)){html=loadingView()}
 else if(v.auth==='profile'&&!S.me?.acceptedAt){location.replace('#cadastro');return}
 else{try{html=v.render(param)}catch(e){console.error(e);html=ph('Algo deu errado')+`<div class="wrap sec">${empty('Não foi possível exibir esta página.',esc(e.message||''))}</div>`}
  if(v.layout==='painel')html=painelLayout(html,v.key||n);if(v.layout==='admin')html=adminLayout(html,v.key||n)}
 const y=window.scrollY;app.innerHTML=html;
 document.title=(typeof v.title==='function'?v.title(param):v.title||'')+(v.title?' · ':'')+st.name;
 if(nav)window.scrollTo(0,0);else window.scrollTo(0,y);
 if(coreReady()&&v.after)try{v.after(param)}catch(e){console.error(e)}
 fillNames(app);renderHeader()}
function onData(){const ready=coreReady();renderHeader();renderFooter();if(!S.route)return;const v=V[S.route.n]||V['404'];const ae=document.activeElement;const typing=ae&&$('#app').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);if(!wasReady&&ready){wasReady=true;render(false);return}if(v.live===false||typing){if(!typing&&v.refresh)try{v.refresh()}catch(e){console.error(e)}return}render(false)}
function loadingView(){const slow=S.slow?`<div class="note or" style="margin-bottom:16px">${ic('alert')} Os dados ainda não puderam ser carregados. Verifique a conexão — esta página atualiza sozinha quando o banco responder.</div>`:'';return`<div class="wrap sec">${slow}<div class="skel" style="height:46px;width:40%;margin-bottom:18px"></div>${skeletons(4)}</div>`}

function searchCompanies(f){const q=slugify(f.q||'').split('-').filter(w=>w.length>1);let list=pubCompanies().map(c=>{let s=0;if(q.length){const name=slugify(c.pubName),kw=slugify((c.keywords||'')+' '+(c.subs||[]).map(catName).join(' ')+' '+catName(c.pubCat)),desc=slugify((c.description||'')+' '+(c.products||[]).map(p=>p.name+' '+(p.desc||'')).join(' ')),loc=slugify(bairroName(c.loc?.bairro)+' '+(zoneById(c.loc?.zone)?.name||''));for(const w of q){if(name.includes(w))s+=5;if(kw.includes(w))s+=3;if(desc.includes(w))s+=1;if(loc.includes(w))s+=1}if(!s)return null}return{c,s}}).filter(Boolean);
 if(f.cat)list=list.filter(({c})=>c.allCats.includes(f.cat)||c.allCats.some(id=>catById(id)?.parent===f.cat));
 if(f.sub)list=list.filter(({c})=>c.allCats.includes(f.sub));
 if(f.zone)list=list.filter(({c})=>c.loc?.zone===f.zone);
 if(f.bairro)list=list.filter(({c})=>c.loc?.bairro===f.bairro);
 if(f.open)list=list.filter(({c})=>isOpen(c)===true);
 if(f.promo){const ids=new Set(activePromos().map(p=>p.companyId));list=list.filter(({c})=>ids.has(c.id))}
 if(f.home)list=list.filter(({c})=>c.estab==='domiciliar'||c.estab==='hibrido');
 if(f.verified)list=list.filter(({c})=>c.verified);
 if(f.minRating)list=list.filter(({c})=>(ratingOf(c.id)?.avg||0)>=f.minRating);
 if(f.type)list=list.filter(({c})=>c.estab===f.type);
 const nb=f.near?bairroById(f.near):null;const prox=c=>!nb?0:c.loc?.bairro===nb.id?2:c.loc?.zone===nb.zone?1:0;
 list.sort((a,b)=>{if(f.sort==='nome')return a.c.pubName.localeCompare(b.c.pubName);if(f.sort==='recentes')return(b.c.approvedAt||0)-(a.c.approvedAt||0);if(f.sort==='avaliacao')return(ratingOf(b.c.id)?.avg||0)-(ratingOf(a.c.id)?.avg||0);if(nb){const d=prox(b.c)-prox(a.c);if(d)return d}return(b.s-a.s)||((b.c.featured?1:0)-(a.c.featured?1:0))||a.c.pubName.localeCompare(b.c.pubName)});
 return list.map(x=>x.c)}

function hoursTable(c){const h=c.hours;if(!h?.week)return'<p class="muted sm">Horário não informado.</p>';const today=DAYS[new Date().getDay()];return`<table class="hours">${WEEK.map(d=>{const x=h.week[d]||{};return`<tr class="${d===today?'today':''}"><td>${DAYL[d]}</td><td style="text-align:right">${x.closed||!x.open?'Fechado':`${esc(x.open)}–${esc(x.close)}${x.breakStart?`<br><span class="xs muted">intervalo ${esc(x.breakStart)}–${esc(x.breakEnd)}</span>`:''}`}</td></tr>`}).join('')}</table>${(h.special||[]).filter(s=>s.date>=dayKey()).length?`<p class="sm" style="margin:10px 0 4px"><b>Horários especiais</b></p>${h.special.filter(s=>s.date>=dayKey()).map(s=>`<div class="sm">${fmtD(s.date)} — ${esc(s.label||'')} ${s.closed?'(fechado)':`${esc(s.open||'')}–${esc(s.close||'')}`}</div>`).join('')}`:''}${h.notes?`<p class="xs muted" style="margin-top:8px">${esc(h.notes)}</p>`:''}`}

function companyPage(c,{draft=false,preview=false}={}){const name=draft?c.name:c.pubName;const cat=draft?c.mainCat:c.pubCat;const ct=c.contacts||{};const wa=waLink(ct.whatsapp,`Olá! Encontrei ${name} no ${site().name}.`);const tel=digits(ct.phone||ct.whatsapp);const route=c.loc?.hideAddress?'':mapsUrl(c);const r=ratingOf(c.id);const o=isOpen(c);const promos=draft?[]:activePromos().filter(p=>p.companyId===c.id);const gal=c.gallery||[];const prods=c.products||[];const reviews=draft?[]:reviewsFor(c.id);const related=draft?[]:pubCompanies().filter(x=>x.id!==c.id&&x.pubCat===c.pubCat).slice(0,3);const cid=esc(c.id||'');const coverU=safeImg(c.cover?.url);
 const mine=S.reviews[S.uid]?.items?.[c.id];
 return`<div class="cp-cover" style="${coverU?`background-image:url('${coverU}')`:coverStyle({...c,pubCat:cat})}"></div><div class="wrap"><div class="cp-head">${logoEl({...c,pubName:name,pubCat:cat},'cp-logo')}<div class="cp-title"><div class="row" style="margin-bottom:8px"><span class="chip">${esc(catName(cat)||'Sem categoria')}</span>${c.loc?.bairro?`<span class="chip chip-gy">${ic('pin','s')}${esc(bairroName(c.loc.bairro))}</span>`:''}${c.verified?`<span class="chip chip-gn">${ic('shield','s')}Verificada</span>`:''}${o===true?'<span class="chip chip-gn">Aberto agora</span>':o===false?'<span class="chip chip-gy">Fechado agora</span>':''}${demoTag(c)}</div><h1>${esc(name)}</h1><div class="row">${stars(r)}${c.estab?`<span class="sm muted">${esc(ESTAB[c.estab]||'')}</span>`:''}</div></div></div>
 <div class="cp-actions">${wa?`<a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener" data-track="w" data-cid="${cid}">${ic('wa')} WhatsApp</a>`:''}${tel?`<a class="btn btn-b" href="tel:${tel}" data-track="p" data-cid="${cid}">${ic('phone')} Ligar</a>`:''}${route?`<a class="btn" href="${route}" target="_blank" rel="noopener" data-track="r" data-cid="${cid}">${ic('route')} Como chegar</a>`:''}<button class="btn" data-act="shareC" data-cid="${cid}" data-track="s">${ic('share')} Compartilhar</button></div>
 ${tel?`<p class="xs muted" style="margin:-10px 0 18px">${ct.phone?'Telefone: '+esc(ct.phone):''}${ct.whatsapp?' · WhatsApp: '+esc(ct.whatsapp):''}</p>`:''}
 <div class="cp-grid"><div>
 <div class="card"><h3>Sobre a empresa</h3><p style="white-space:pre-line">${esc(c.description||'Descrição não informada.')}</p><div class="row sm muted">${c.founded?`<span>Desde ${esc(c.founded)}</span>`:''}${(c.subs||[]).map(id=>`<span class="chip chip-gy">${esc(catName(id))}</span>`).join('')}${(c.extraCats||[]).map(id=>`<span class="chip chip-gy">${esc(catName(id))}</span>`).join('')}</div></div>
 ${gal.length?`<div class="card"><h3>Galeria de fotos</h3><div class="cp-gal">${gal.map((g,i)=>`<button data-act="lightbox" data-src="${esc(safeImg(g.url))}" data-cap="${esc(g.caption||'')}" aria-label="Ampliar foto ${i+1}"><img src="${esc(safeImg(g.url))}" alt="${esc(g.caption||'Foto de '+name)}" loading="lazy"></button>`).join('')}</div></div>`:''}
 ${promos.length?`<div class="card"><h3>${ic('tag')} Promoções ativas</h3><div class="grid g2">${promos.map(p=>`<div class="pcard" style="transform:none"><div class="pimg" style="height:120px;${safeImg(p.image?.url)?`background-image:url('${safeImg(p.image.url)}')`:coverStyle(c)}"><span class="pct">${discount(p)?'-'+discount(p)+'%':esc(PROMO_TYPES[p.type]||'Oferta')}</span></div><div class="pbody"><h4>${esc(p.title)}</h4><p class="sm" style="margin:0">${esc(p.desc||'')}</p><div class="price">${num(p.priceFrom)&&num(p.priceTo)?`<s>${money(num(p.priceFrom))}</s>`:''}${num(p.priceTo)?`<b>${money(num(p.priceTo))}</b>`:''}</div>${p.code?`<p class="sm" style="margin:4px 0 0">Cupom: <b>${esc(p.code)}</b></p>`:''}<p class="xs muted" style="margin:4px 0 0">${p.start?'De '+fmtD(p.start)+' ':''}${p.end?'até '+fmtD(p.end):''}${p.qty?` · ${esc(p.qty)} unidades`:''}</p>${p.terms?`<details class="xs"><summary>Termos e condições</summary>${esc(p.terms)}</details>`:''}${p.whatsapp||wa?`<a class="btn btn-wa btn-sm" style="margin-top:8px" target="_blank" rel="noopener" href="${waLink(p.whatsapp||ct.whatsapp,`Olá! Quero aproveitar a promoção "${p.title}".`)}" data-track="w" data-cid="${cid}">${ic('wa','s')} Quero esta oferta</a>`:''}</div></div>`).join('')}</div></div>`:''}
 ${prods.length?`<div class="card"><h3>Produtos e serviços</h3><div class="grid g2">${prods.map(p=>`<div class="prod">${safeImg(p.image?.url)?`<img src="${esc(safeImg(p.image.url))}" alt="">`:`<span class="pi">${ic(p.kind==='servico'?'brief':'box')}</span>`}<div><b>${esc(p.name)}</b><div class="xs muted">${p.kind==='servico'?'Serviço':'Produto'}${num(p.price)?' · '+money(num(p.price)):''}</div>${p.desc?`<div class="sm">${esc(p.desc)}</div>`:''}</div></div>`).join('')}</div></div>`:''}
 ${draft?'':`<div class="card" id="avaliacoes"><h3>Avaliações</h3>${reviews.length?`<div class="list">${reviews.map(rv=>`<div class="li" style="align-items:flex-start;display:block"><div class="row between"><b data-uname="${esc(rv.uid)}">Usuário do portal</b><span class="stars">${'★'.repeat(+rv.rating||0)}<span class="muted" style="font-weight:400">${'★'.repeat(5-(+rv.rating||0))}</span></span></div><p class="sm" style="margin:6px 0 0">${esc(rv.text||'')}</p><div class="xs muted">${fmtD(rv.at)}</div>${c.replies?.[rv.uid]?`<div class="note" style="margin-top:8px"><b>Resposta da empresa:</b> ${esc(c.replies[rv.uid].text)}</div>`:''}</div>`).join('')}</div>`:'<p class="muted sm">Ainda sem avaliações.</p>'}
 ${S.uid&&c.ownerId!==S.uid&&!preview?`<form data-form="review" data-cid="${cid}" style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><b class="sm">${mine?'Atualizar sua avaliação':'Avaliar esta empresa'}</b><div class="row" role="radiogroup" aria-label="Nota" style="margin:8px 0">${[1,2,3,4,5].map(n=>`<label class="chk" style="padding:0 6px 0 0"><input type="radio" name="rating" value="${n}" ${+mine?.rating===n?'checked':''} required>${n}★</label>`).join('')}</div><div class="fld"><label for="rvText">Comentário</label><textarea id="rvText" name="text" maxlength="600" placeholder="Conte como foi sua experiência">${esc(mine?.text||'')}</textarea><span class="hint">Avaliações são moderadas e podem ser removidas se violarem as regras de uso.</span></div><button class="btn btn-b btn-sm">Enviar avaliação</button>${mine?` <button type="button" class="btn btn-g btn-sm btn-dl" data-act="delReview" data-cid="${cid}">Remover minha avaliação</button>`:''}</form>`:S.uid?'':'<p class="xs muted">Entre com sua conta para avaliar.</p>'}</div>`}
 ${related.length?`<div style="margin-top:22px"><h3>Empresas relacionadas</h3><div class="grid g3">${related.map(cCard).join('')}</div></div>`:''}
 </div><aside>
 <div class="card"><h3>${ic('clock')} Horário de funcionamento</h3>${hoursTable(c)}</div>
 <div class="card"><h3>Contatos e redes</h3><div class="list">${[[ct.phone,'phone','Telefone',tel?'tel:'+digits(ct.phone):''],[ct.whatsapp,'wa','WhatsApp',wa],[ct.email,'mail','E-mail','mailto:'+(ct.email||'')],[ct.instagram,'insta','Instagram',igLink(ct.instagram)],[ct.facebook,'fb','Facebook',fbLink(ct.facebook)],[ct.site,'globe','Site oficial',safeUrl(ct.site)],[ct.catalog,'list','Catálogo',safeUrl(ct.catalog)]].filter(x=>x[0]).map(([v,i,l,h])=>`<a class="row" href="${esc(h)}" ${/^https/.test(h)?'target="_blank" rel="noopener"':''} data-track="${i==='wa'?'w':i==='phone'?'p':'l'}" data-cid="${cid}" style="gap:10px;color:inherit">${ic(i,'s')}<span class="sm"><b>${l}</b><br>${esc(v)}</span></a>`).join('')||'<p class="muted sm">Sem contatos informados.</p>'}</div></div>
 <div class="card"><h3>${ic('pin')} Endereço</h3>${c.loc?.hideAddress?`<p class="sm">Endereço não divulgado — atendimento ${c.estab==='domiciliar'?'em domicílio':'sob consulta'}.</p>`:`<p class="sm">${esc(addrText(c))||'Endereço não informado.'}</p><div class="mapbox">${miniMap(c)}</div>${route?`<a class="btn btn-sm" style="margin-top:10px" href="${route}" target="_blank" rel="noopener" data-track="r" data-cid="${cid}">${ic('route','s')} Abrir rota no Google Maps</a>`:''}`}${c.loc?.area?`<p class="sm" style="margin-top:10px"><b>Área de atendimento:</b> ${esc(c.loc.area)}</p>`:''}</div>
 </aside></div></div>`}
V['empresa*']={title:p=>compBySlug(p)?.pubName||'Empresa',live:false,render(slug){const c=compBySlug(slug);if(!c)return V['404'].render();const can=c.ownerId===S.uid||S.admin;if(!c.pub&&!can)return ph('Empresa indisponível')+`<div class="wrap sec">${empty('Esta página não está publicada.','Ela pode estar em análise ou suspensa.')}</div>`;const banner=!c.pub?`<div class="preview-banner"><div class="wrap row between"><span>${ic('eye','s')} Pré-visualização — esta página ainda não está pública (${esc(CSTATUS[c.status]?.[0]||c.status)}).</span>${c.ownerId===S.uid?'<a href="#painel-empresa">Editar</a>':''}</div></div>`:c.status==='revisao'&&can?`<div class="preview-banner"><div class="wrap">Alterações sensíveis (nome ou categoria principal) aguardam nova aprovação; o público vê a versão aprovada.</div></div>`:'';return banner+`<div class="wrap crumb" style="padding-top:12px"><a href="#inicio">Início</a> › <a href="#empresas">Empresas</a> › <a href="#categoria-${esc(c.pubCat)}">${esc(catName(c.pubCat))}</a></div>`+companyPage(c,{draft:false})},after(slug){const c=compBySlug(slug);if(c&&c.pub&&!S.viewed.has(c.id)){S.viewed.add(c.id);track(c.id,'v')}}};
ACT.shareC=async a=>{const c=compById(a.dataset.cid)||{};const ct=c.contacts||{};const txt=`${c.pubName||c.name} — ${catName(c.pubCat)} em ${site().city}. Encontre no ${site().name}.${ct.whatsapp?' WhatsApp: '+ct.whatsapp:''}${ct.phone?' Tel: '+ct.phone:''}`;try{await navigator.clipboard.writeText(txt);toast('Texto de divulgação copiado. Cole onde quiser compartilhar.','ok')}catch(e){modal(`<h3>Compartilhar</h3><p class="sm">Copie o texto abaixo:</p><textarea class="inp" style="min-height:100px" readonly>${esc(txt)}</textarea>`)}};
ACT.lightbox=a=>modal(`<div class="lightbox"><img src="${esc(a.dataset.src)}" alt="${esc(a.dataset.cap)}">${a.dataset.cap?`<p class="sm" style="text-align:center;margin-top:10px">${esc(a.dataset.cap)}</p>`:''}</div>`,{wide:true});
FORM.review=async(f,o)=>{const cid=f.dataset.cid;const rating=+o.rating;if(!(rating>=1&&rating<=5))return toast('Escolha uma nota de 1 a 5.','err');if(await W(mutate('reviews/'+S.uid,()=>S.reviews[S.uid],v=>S.reviews[S.uid]=v,b=>{b.items=b.items||{};b.items[cid]={rating,text:(o.text||'').slice(0,600),at:now()}}),'Avaliação enviada. Obrigado!'))render(false)};
ACT.delReview=async a=>{if(!await confirmBox('Remover sua avaliação desta empresa?',{ok:'Remover',danger:true}))return;if(await W(mutate('reviews/'+S.uid,()=>S.reviews[S.uid],v=>S.reviews[S.uid]=v,b=>{if(b.items)delete b.items[a.dataset.cid]}),'Avaliação removida.'))render(false)};

V.categorias={title:'Categorias',render(){const mc=mainCats();return ph('Categorias','Todas as categorias e subcategorias do guia comercial.')+`<div class="wrap sec">${mc.length?`<div class="grid g3">${mc.map(c=>{const col=CATCOLOR[c.icon]||'#287DA3';const subs=subCats(c.id);return`<div class="card"><a href="#categoria-${esc(c.id)}" class="row" style="color:inherit;gap:12px;text-decoration:none"><span class="ci" style="width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:${col}1a;color:${col}">${ic(c.icon,'l')}</span><h3 style="margin:0">${esc(c.name)}</h3></a><div class="row" style="margin-top:12px">${subs.slice(0,14).map(s=>`<a class="chip chip-gy" href="#empresas" ${fAttr({cat:c.id,sub:s.id})}>${esc(s.name)}</a>`).join('')}${subs.length>14?`<a class="chip" href="#categoria-${esc(c.id)}">+${subs.length-14}</a>`:''}</div></div>`}).join('')}</div>`:empty('Nenhuma categoria cadastrada.')}</div>`}};
V['categoria*']={title:p=>catName(p)||'Categoria',render(id){const c=catById(id);if(!c)return V['404'].render();const main=c.parent?catById(c.parent):c;const subs=subCats(main.id);const list=searchCompanies({...F0,cat:c.parent?'':c.id,sub:c.parent?c.id:''});const pr=activePromos().filter(p=>p.company&&(p.company.allCats.includes(c.id)||p.company.allCats.some(x=>catById(x)?.parent===c.id)));const col=CATCOLOR[main.icon]||'#287DA3';return`<div class="ph" style="background:linear-gradient(180deg,${col}14,#fff)"><div class="wrap"><div class="crumb"><a href="#categorias">Categorias</a>${c.parent?` › <a href="#categoria-${esc(main.id)}">${esc(main.name)}</a>`:''}</div><h1 class="row" style="gap:14px"><span style="color:${col}">${ic(main.icon,'l')}</span>${esc(c.name)}</h1><div class="row">${subs.map(s=>`<a class="chip ${s.id===c.id?'chip-or':'chip-gy'}" href="#categoria-${esc(s.id)}">${esc(s.name)}</a>`).join('')}</div></div></div><div class="wrap sec">${pr.length?`<h3>${ic('tag')} Ofertas nesta categoria</h3><div class="grid g4" style="margin-bottom:30px">${pr.slice(0,4).map(pCard).join('')}</div>`:''}<div class="row between"><h3>${nf(list.length)} empresa${list.length===1?'':'s'}</h3><a href="#empresas" ${fAttr({cat:c.parent?'':c.id,sub:c.parent?c.id:''})}>Filtrar no diretório</a></div>${list.length?`<div class="grid g4">${list.map(cCard).join('')}</div>`:empty('Nenhuma empresa nesta categoria ainda.','',`<a class="btn btn-p" href="#cadastro">Cadastre a sua</a>`)}</div>`}};

V.servicos={title:'Serviços',live:false,render(){return ph('Serviços','Serviços oferecidos pelas empresas e profissionais da cidade.')+`<div class="wrap sec"><div class="fld" style="max-width:480px"><label for="svcQ">Buscar serviço</label><input id="svcQ" type="search" placeholder="Ex.: instalação elétrica, limpeza, manicure"></div><div id="svcList"></div></div>`},after(){const draw=()=>{const q=slugify($('#svcQ').value);const items=pubCompanies().flatMap(c=>(c.products||[]).filter(p=>p.kind==='servico').map(p=>({p,c}))).filter(({p,c})=>!q||q==='item'||slugify(p.name+' '+(p.desc||'')+' '+c.pubName).includes(q));$('#svcList').innerHTML=items.length?`<div class="grid g3">${items.map(({p,c})=>`<a class="card" href="#empresa-${esc(c.slug)}" style="color:inherit;text-decoration:none;display:block"><span class="chip">${esc(catName(c.pubCat))}</span><h4 style="margin:10px 0 4px">${esc(p.name)}</h4><p class="sm muted" style="margin:0">${esc(p.desc||'')}</p><div class="row between" style="margin-top:10px"><span class="sm"><b>${esc(c.pubName)}</b></span>${num(p.price)?`<b style="color:#b25f17">${money(num(p.price))}</b>`:'<span class="xs muted">Sob consulta</span>'}</div></a>`).join('')}</div>`:empty('Nenhum serviço encontrado.','Empresas cadastram seus serviços no painel, em Produtos e serviços.')};$('#svcQ').oninput=draw;draw()},refresh(){$('#svcQ')?.dispatchEvent(new Event('input'))}};
V.profissionais={title:'Profissionais',render(){const list=pubCompanies().filter(c=>c.estab==='domiciliar'||c.personType==='pf');return ph('Profissionais autônomos','Eletricistas, diaristas, manicures, técnicos e outros profissionais que atendem na cidade.')+`<div class="wrap sec">${list.length?`<div class="grid g4">${list.map(cCard).join('')}</div>`:empty('Nenhum profissional publicado ainda.','',`<a class="btn btn-p" href="#cadastro">Cadastre-se como profissional</a>`)}</div>`}};

V.ofertas={title:'Ofertas',render(){const all=activePromos();const fc=S.oc||'';const fz=S.oz||'';const list=all.filter(p=>(!fc||p.company.allCats.includes(fc)||p.company.allCats.some(x=>catById(x)?.parent===fc))&&(!fz||p.company.loc?.zone===fz));const used=mainCats().filter(c=>all.some(p=>p.company.allCats.includes(c.id)||p.company.allCats.some(x=>catById(x)?.parent===c.id)));return ph('Ofertas da cidade','Promoções publicadas pelas empresas locais. Promoções vencidas saem do ar automaticamente.')+`<div class="wrap sec"><div class="row" style="margin-bottom:10px"><button class="chip ${!fc?'chip-or':'chip-gy'}" data-act="oc" data-v="">Todas</button>${used.map(c=>`<button class="chip ${fc===c.id?'chip-or':'chip-gy'}" data-act="oc" data-v="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div><div class="row" style="margin-bottom:22px"><span class="sm muted">Zona:</span><button class="chip ${!fz?'':'chip-gy'}" data-act="oz" data-v="">Todas</button>${zones().map(z=>`<button class="chip ${fz===z.id?'':'chip-gy'}" data-act="oz" data-v="${esc(z.id)}">${esc(z.name)}</button>`).join('')}</div>${list.length?`<div class="grid g4">${list.map(pCard).join('')}</div>`:empty('Nenhuma oferta ativa com esses filtros.')}</div>${adSlot('ofertas')}`}};

V.eventos={title:'Eventos',render(){const t=S.et||'';const evs=upcomingEvents().filter(e=>!t||e.type===t);const groups={};evs.forEach(e=>{const d=new Date((e.date||'')+'T12:00:00');const k=isNaN(d)?'Sem data':d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});(groups[k]=groups[k]||[]).push(e)});return ph('Eventos e agenda',`Shows, feiras, festas tradicionais e tudo o que acontece em ${esc(site().city)}.`)+`<div class="wrap sec"><div class="row" style="margin-bottom:22px"><button class="chip ${!t?'chip-or':'chip-gy'}" data-act="et" data-v="">Todos</button>${EVENT_TYPES.map(x=>`<button class="chip ${t===x?'chip-or':'chip-gy'}" data-act="et" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${Object.keys(groups).length?Object.entries(groups).map(([k,a])=>`<h3 style="text-transform:capitalize;margin-top:10px">${esc(k)}</h3><div class="grid g2" style="margin-bottom:22px">${a.map(eCard).join('')}</div>`).join(''):empty('Nenhum evento agendado.')}</div>`}};
ACT.et=a=>{S.et=a.dataset.v;render(false)};
V['evento*']={title:p=>allEvents().find(e=>e.id===p)?.title||'Evento',render(id){const e=allEvents().find(x=>x.id===id);if(!e)return V['404'].render();const u=safeImg(e.image?.url);const maps=e.address||e.place?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([e.address||e.place,site().city].join(', '))}`:'';return`<div class="article"><div class="crumb"><a href="#eventos">Eventos</a></div><span class="chip chip-mr">${esc(e.type||'Evento')}</span> ${demoTag(e)}<h1 style="font-size:clamp(26px,4vw,40px);margin-top:10px">${esc(e.title)}</h1>${u?`<img class="hero-img" src="${u}" alt="">`:''}<div class="card" style="margin:16px 0"><div class="grid g2" style="gap:10px"><div class="row">${ic('cal')}<span><b>${fmtD(e.date)}${e.endDate&&e.endDate!==e.date?' a '+fmtD(e.endDate):''}</b>${e.time?'<br>'+esc(e.time):''}</span></div><div class="row">${ic('pin')}<span><b>${esc(e.place||'')}</b>${e.address?'<br>'+esc(e.address):''}</span></div>${e.organizer||e.company?`<div class="row">${ic('users')}<span>Organização: <b>${esc(e.organizer||e.company?.pubName)}</b></span></div>`:''}</div><div class="row" style="margin-top:14px">${maps?`<a class="btn" href="${maps}" target="_blank" rel="noopener">${ic('map','s')} Ver no mapa</a>`:''}${e.link?`<a class="btn btn-b" href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener">${ic('ext','s')} Link do evento</a>`:''}${e.company?`<a class="btn" href="#empresa-${esc(e.company.slug)}">Página do organizador</a>`:''}</div></div><p style="white-space:pre-line">${esc(e.description||'')}</p></div>`}};

/* ---------- turismo ---------- */
V.turismo={title:'Turismo',render(){const k=S.tk||'';const items=S.tourism.filter(t=>!k||t.kind===k);const hotels=companiesIn('turismo',8);const kinds=TOUR_KINDS.filter(x=>S.tourism.some(t=>t.kind===x));const hist=S.tourism.find(t=>t.kind==='História da cidade');return`<div class="ph" style="background:linear-gradient(135deg,#eef2e8,#fff 60%)"><div class="wrap"><div class="eyebrow" style="color:var(--vd)">Turismo e valorização regional</div><h1>Conheça ${esc(site().city)}</h1><p class="muted" style="max-width:680px">História, pontos turísticos, gastronomia típica, turismo rural, roteiros e o artesanato que fazem a identidade da região.</p><div class="row"><a class="btn btn-v" href="#mapa">${ic('map','s')} Mapa turístico</a>${hist?`<a class="btn" href="#turismo-${esc(hist.id)}">História da cidade</a>`:''}</div></div></div><div class="wrap sec"><div class="row" style="margin-bottom:22px"><button class="chip ${!k?'chip-vd':'chip-gy'}" data-act="tk" data-v="">Tudo</button>${kinds.map(x=>`<button class="chip ${k===x?'chip-vd':'chip-gy'}" data-act="tk" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${items.length?`<div class="grid g3">${items.map(tCard).join('')}</div>`:empty('Conteúdo turístico em preparação.','O administrador publica pontos, roteiros e história em Administração → Conteúdos.')}</div>${hotels.length?sec('Onde ficar e o que viver','Hotéis, pousadas, agências e experiências locais.',['#categoria-turismo','Ver todos'],`<div class="grid g4">${hotels.map(cCard).join('')}</div>`,'alt'):''}`}};
ACT.tk=a=>{S.tk=a.dataset.v;render(false)};
V['turismo*']={title:p=>S.tourism.find(t=>t.id===p)?.title||'Turismo',render(id){const t=S.tourism.find(x=>x.id===id);if(!t)return V['404'].render();const u=safeImg(t.image?.url);const rel=(t.companies||[]).map(compById).filter(c=>c?.pub);const steps=String(t.steps||'').split('\n').map(s=>s.trim()).filter(Boolean);const maps=t.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.address+', '+site().city)}`:'';return`<div class="article"><div class="crumb"><a href="#turismo">Turismo</a></div><span class="chip chip-vd">${esc(t.kind)}</span> ${demoTag(t)}<h1 style="font-size:clamp(26px,4vw,40px);margin-top:10px">${esc(t.title)}</h1>${t.summary?`<p class="muted" style="font-size:19px">${esc(t.summary)}</p>`:''}${u?`<img class="hero-img" src="${u}" alt="">`:''}<p style="white-space:pre-line">${esc(t.body||'')}</p>${steps.length?`<div class="card"><h3>Roteiro sugerido</h3><ol style="margin:0;padding-left:20px">${steps.map(s=>`<li style="margin:6px 0">${esc(s)}</li>`).join('')}</ol></div>`:''}${maps?`<p><a class="btn" href="${maps}" target="_blank" rel="noopener">${ic('map','s')} Ver no mapa</a></p>`:''}${rel.length?`<h3 style="margin-top:26px">Estabelecimentos relacionados</h3><div class="grid g2">${rel.map(cCard).join('')}</div>`:''}</div>`}};

V.empregos={title:'Empregos',render(){const j=allJobs();return ph('Vagas e oportunidades','Vagas publicadas por empresas locais e oportunidades de capacitação e empreendedorismo.')+`<div class="wrap sec"><div class="row between"><h3>${nf(j.length)} vaga${j.length===1?'':'s'} aberta${j.length===1?'':'s'}</h3>${S.uid?'<a class="btn btn-sm" href="#painel-vagas">Publicar vaga da minha empresa</a>':''}</div>${j.length?`<div class="list">${j.map(jobItem).join('')}</div>`:empty('Nenhuma vaga aberta no momento.')}${S.opps.length?`<h3 style="margin-top:38px">Oportunidades</h3><div class="grid g3">${S.opps.map(o=>`<div class="card"><span class="chip chip-vd">${esc(o.kind||'')}</span><h4 style="margin:10px 0 6px">${esc(o.title)}</h4><p class="sm muted">${esc(o.summary||'')}</p>${o.date?`<p class="xs">${ic('cal','s')} ${fmtD(o.date)}</p>`:''}${o.link?`<a href="${esc(safeUrl(o.link))}" target="_blank" rel="noopener" class="sm">Saiba mais ${ic('ext','s')}</a>`:''} ${demoTag(o)}</div>`).join('')}</div>`:''}</div>`}};
V.noticias={title:'Notícias',render(){const c=S.nc||'';const list=pubNews().filter(n=>!c||n.category===c);return ph('Notícias locais','Cidade, economia, comércio, cultura, turismo e serviços públicos.')+`<div class="wrap sec"><div class="row" style="margin-bottom:22px"><button class="chip ${!c?'chip-or':'chip-gy'}" data-act="nc" data-v="">Todas</button>${NEWS_CATS.map(x=>`<button class="chip ${c===x?'chip-or':'chip-gy'}" data-act="nc" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>${list.length?`<div class="grid g3">${list.map(nCard).join('')}</div>`:empty('Nenhuma notícia nesta categoria.')}</div>`}};
ACT.nc=a=>{S.nc=a.dataset.v;render(false)};
V['noticia*']={title:p=>S.news.find(n=>n.id===p)?.title||'Notícia',render(id){const n=S.news.find(x=>x.id===id);if(!n||n.status==='rascunho')return V['404'].render();const u=safeImg(n.image?.url);return`<article class="article"><div class="crumb"><a href="#noticias">Notícias</a> › ${esc(n.category||'')}</div>${demoTag(n)}<h1 style="font-size:clamp(26px,4vw,42px);margin-top:8px">${esc(n.title)}</h1>${n.summary?`<p class="muted" style="font-size:19px">${esc(n.summary)}</p>`:''}<p class="sm muted">${fmtD(n.publishedAt)}${n.author?' · '+esc(n.author):''}</p>${u?`<img class="hero-img" src="${u}" alt="">`:''}<div style="white-space:pre-line">${esc(n.body||'')}</div></article>`}};
V['telefones-uteis']={title:'Telefones úteis',live:false,render(){return ph('Telefones úteis','Contatos essenciais validados pelo administrador do portal. Em emergência, ligue imediatamente.')+`<div class="wrap sec"><div class="row" style="margin-bottom:18px"><input id="telQ" class="inp" type="search" placeholder="Buscar contato" aria-label="Buscar contato" style="max-width:340px"><select id="telC" class="inp" style="width:auto" aria-label="Categoria"><option value="">Todas as categorias</option>${PHONE_CATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="telList"></div><p class="xs muted" style="margin-top:16px">Se o botão de ligação não abrir no seu dispositivo, disque o número exibido.</p></div>`},after(){const draw=()=>{const q=slugify($('#telQ').value),c=$('#telC').value;const l=S.phones.filter(p=>(!c||p.category===c)&&(!$('#telQ').value||slugify(p.name+' '+p.category).includes(q))).sort((a,b)=>(a.category==='Emergência'?0:1)-(b.category==='Emergência'?0:1)||(a.order||99)-(b.order||99)||String(a.name).localeCompare(b.name));const groups={};l.forEach(p=>(groups[p.category||'Outros']=groups[p.category||'Outros']||[]).push(p));$('#telList').innerHTML=l.length?Object.entries(groups).map(([k,a])=>`<h3 style="margin-top:14px">${esc(k)}</h3><div class="grid g2">${a.map(phoneItem).join('')}</div>`).join(''):empty('Nenhum contato encontrado.')};$('#telQ').oninput=draw;$('#telC').onchange=draw;draw()},refresh(){$('#telQ')?.dispatchEvent(new Event('input'))}};
